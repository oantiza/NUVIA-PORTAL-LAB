name: Publicar NUVIA Portal Lab en GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # El BCE publica el €STR cada día hábil a las 08:00 CET.
    # A las 08:30 UTC ya está disponible tanto en horario de invierno
    # como de verano; en fines de semana conserva la última observación.
    - cron: '30 8 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias del portal
        run: npm ci

      - name: Preparar Chromium para la auditoría visual
        run: npx playwright install --with-deps chromium

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Actualizar la tasa sin riesgo oficial del BCE
        run: node scripts/update-ecb-risk-free.mjs
        # Si el portal del BCE tiene una incidencia puntual, se publica la
        # última copia verificada incluida en el repositorio y la fecha visible
        # deja claro hasta qué observación llega.
        continue-on-error: true

      - name: Actualizar noticias económicas
        run: node scripts/update-daily-news.mjs
        # Si los medios o una imagen no responden, se conserva la última
        # selección editorial verificada incluida en el repositorio.
        continue-on-error: true

      - name: Construir y validar la web
        run: npm run build

      - name: Preparar los archivos publicados
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
