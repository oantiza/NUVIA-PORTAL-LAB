name: Publicar NUVIA Web 3 en GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '15 6 * * 1-5'
    - cron: '15 6 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Actualizar la noticia económica de portada
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run update:news

      - name: Actualizar indicadores macroeconómicos oficiales
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 6 * * 1-5'
        run: npm run update:macro

      - name: Guardar la actualización diaria
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-content.json src/assets/home/daily-news
          if git diff --cached --quiet; then
            echo "El contenido diario ya estaba actualizado."
          else
            git commit -m "Actualizar contenido diario de portada"
            git push
          fi

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Construir la web
        run: npm run build

      - name: Preparar los archivos publicados
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
