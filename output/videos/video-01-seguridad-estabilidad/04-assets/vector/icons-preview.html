<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>NUVIA · Iconos del vídeo 01</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#FAF7EE;color:#0B2347;font-family:Inter,Arial,sans-serif}.sheet{width:1200px;min-height:760px;padding:64px}.eyebrow{color:#7C9A44;font-size:14px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}.title{font-family:Georgia,serif;font-size:44px;font-weight:500;margin:12px 0 36px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.card{display:flex;min-height:240px;flex-direction:column;align-items:center;justify-content:center;border:1px solid #E2D8C5;border-radius:18px;background:#fffdf8;box-shadow:0 10px 25px rgba(11,35,71,.07);padding:24px;text-align:center}.icon{width:104px;height:104px;margin-bottom:22px}.label{font-size:15px;font-weight:700;line-height:1.3}.type{color:#68758a;font-size:12px;margin-top:7px}
</style>
</head>
<body>
<main class="sheet">
  <div class="eyebrow">NUVIA Academy · Activos financieros 01</div>
  <h1 class="title">Sistema vectorial del vídeo</h1>
  <section class="grid">
    <article class="card"><img class="icon" src="icons/icon-riesgo-inflacion.svg" alt=""><div class="label">Inflación</div><div class="type">Riesgo</div></article>
    <article class="card"><img class="icon" src="icons/icon-riesgo-tipos.svg" alt=""><div class="label">Tipos de interés</div><div class="type">Riesgo</div></article>
    <article class="card"><img class="icon" src="icons/icon-riesgo-solvencia.svg" alt=""><div class="label">Solvencia</div><div class="type">Riesgo</div></article>
    <article class="card"><img class="icon" src="icons/icon-riesgo-venta-anticipada.svg" alt=""><div class="label">Venta anticipada</div><div class="type">Riesgo</div></article>
    <article class="card"><img class="icon" src="icons/icon-objetivo.svg" alt=""><div class="label">Objetivo</div><div class="type">Decisión</div></article>
    <article class="card"><img class="icon" src="icons/icon-horizonte.svg" alt=""><div class="label">Horizonte</div><div class="type">Decisión</div></article>
    <article class="card"><img class="icon" src="icons/icon-liquidez.svg" alt=""><div class="label">Liquidez</div><div class="type">Función</div></article>
    <article class="card"><img class="icon" src="icons/icon-fondo-vehiculo.svg" alt=""><div class="label">Fondo</div><div class="type">Vehículo</div></article>
    <article class="card"><img class="icon" src="icons/icon-proteccion-depositos.svg" alt=""><div class="label">Protección de depósitos</div><div class="type">Institución</div></article>
    <article class="card"><img class="icon" src="icons/icon-fiscalidad.svg" alt=""><div class="label">Fiscalidad</div><div class="type">Regla general</div></article>
  </section>
</main>
</body>
</html>
