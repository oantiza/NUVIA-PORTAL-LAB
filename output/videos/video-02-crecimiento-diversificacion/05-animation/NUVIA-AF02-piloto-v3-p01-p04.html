<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NUVIA AF02 · Piloto audiovisual V3</title><style>
@font-face{font-family:Inter;src:url('../04-assets/fonts/Inter-Variable.ttf') format('truetype');font-weight:100 900}
@font-face{font-family:Fraunces;src:url('../04-assets/fonts/Fraunces-Variable.ttf') format('truetype');font-weight:100 900}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F8F4EA}canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style></head><body><canvas id="stage" width="1920" height="1080"></canvas><script>
const W=1920,H=1080,LAST=1289;
const C={paper:'#F8F4EA',navy:'#071D3D',ink:'#213650',muted:'#66758B',gold:'#BD9250',gold2:'#D5A51D',teal:'#187F73',violet:'#7355A6',coral:'#C85E4D',cyan:'#3E819D',white:'#FFFCF5',line:'#D8D0C0'};
const PLANS=[['P01',0,300],['P02',300,630],['P03',630,960],['P04',960,1290]];
const cv=document.getElementById('stage'),x=cv.getContext('2d');
const imgs={company:new Image(),fund:new Image(),etf:new Image()};
imgs.company.src='../04-assets/raster/empresa-accion-3d.png';imgs.fund.src='../04-assets/raster/fondo-diversificado-3d.png';imgs.etf.src='../04-assets/raster/etf-cotizado-3d.png';
const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2},out=v=>1-Math.pow(1-clamp(v),3),lerp=(a,b,t)=>a+(b-a)*t;
const lp=(f,s,e)=>clamp((f-s)/(e-s)),phase=(p,a,b)=>ease((p-a)/(b-a));
function rr(px,py,pw,ph,r,fill,stroke=null,lw=1){x.beginPath();x.roundRect(px,py,pw,ph,r);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}
function line(ax,ay,bx,by,color=C.line,w=3,dash=[]){x.beginPath();x.moveTo(ax,ay);x.lineTo(bx,by);x.strokeStyle=color;x.lineWidth=w;x.setLineDash(dash);x.stroke();x.setLineDash([])}
function circle(cx,cy,r,fill,stroke=null,lw=1){x.beginPath();x.arc(cx,cy,r,0,Math.PI*2);if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=lw;x.stroke()}}
function txt(t,px,py,size,color=C.navy,weight=600,family='Inter',align='left',alpha=1){x.save();x.globalAlpha=alpha;x.font=`${weight} ${size}px ${family}`;x.fillStyle=color;x.textAlign=align;x.textBaseline='alphabetic';x.fillText(t,px,py);x.restore()}
function fit(t,px,py,max,size,color=C.navy,weight=620,family='Inter',align='left',alpha=1){let z=size;x.font=`${weight} ${z}px ${family}`;while(x.measureText(t).width>max&&z>18){z--;x.font=`${weight} ${z}px ${family}`}txt(t,px,py,z,color,weight,family,align,alpha)}
function pill(t,px,py,pw,bg=C.navy,fg=C.paper,alpha=1){x.save();x.globalAlpha=alpha;rr(px,py,pw,52,26,bg);fit(t,px+pw/2,py+35,pw-24,20,fg,720,'Inter','center');x.restore()}
function image(im,px,py,pw,ph,alpha=1,scale=1){if(!im.complete||!im.naturalWidth)return;const r=Math.min(pw/im.naturalWidth,ph/im.naturalHeight)*scale,dw=im.naturalWidth*r,dh=im.naturalHeight*r;x.save();x.globalAlpha=alpha;x.drawImage(im,px+(pw-dw)/2,py+(ph-dh)/2,dw,dh);x.restore()}
function shadowEllipse(cx,cy,rx,ry,alpha=.22){x.save();x.filter='blur(16px)';x.globalAlpha=alpha;x.fillStyle='#071D3D';x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);x.fill();x.restore()}
function arrow(ax,ay,bx,by,color=C.gold,w=5,p=1){const ex=lerp(ax,bx,p),ey=lerp(ay,by,p);line(ax,ay,ex,ey,color,w);if(p>.92){const a=Math.atan2(by-ay,bx-ax),q=(p-.92)/.08;x.save();x.globalAlpha=q;x.beginPath();x.moveTo(bx,by);x.lineTo(bx-18*Math.cos(a-.55),by-18*Math.sin(a-.55));x.lineTo(bx-18*Math.cos(a+.55),by-18*Math.sin(a+.55));x.closePath();x.fillStyle=color;x.fill();x.restore()}}
function card(px,py,pw,ph,fill=C.white,stroke=C.line,alpha=1){x.save();x.globalAlpha=alpha;x.shadowColor='rgba(7,29,61,.13)';x.shadowBlur=30;x.shadowOffsetY=14;rr(px,py,pw,ph,24,fill,stroke,1.5);x.restore()}
function bg(f,scene){const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#FBF8F0');g.addColorStop(1,'#F3ECDD');x.fillStyle=g;x.fillRect(0,0,W,H);x.save();x.globalAlpha=.12;for(let i=0;i<7;i++){const yy=210+i*115;line(610,yy,1840,yy,C.gold,1)}for(let i=0;i<12;i++){const xx=610+i*110;line(xx,170,xx,930,C.gold,1)}x.restore();const drift=(f%300)/300;circle(1660+80*Math.sin(drift*Math.PI*2),180,230,'rgba(189,146,80,.045)');circle(1540,760+50*Math.cos(drift*Math.PI*2),300,'rgba(24,127,115,.035)');header(scene);footer(f)}
function header(scene){pill('NUVIA ACADEMY',72,54,250,C.navy);txt('ACTIVOS FINANCIEROS',1840,88,23,C.ink,580,'Inter','right');txt('02',1840,127,36,C.gold,760,'Inter','right');txt(scene,72,155,16,C.muted,750)}
function footer(f){line(72,1015,1848,1015,'rgba(7,29,61,.12)',2);const q=f/LAST;line(72,1015,72+1776*q,1015,C.gold,4);circle(72+1776*q,1015,7,C.paper,C.gold,3)}
function bigTitle(k,lines,accent=C.gold,alpha=1){txt(k.toUpperCase(),72,246,21,accent,760,'Inter','left',alpha);lines.forEach((t,i)=>fit(t,72,340+i*78,520,70,C.navy,520,'Fraunces','left',alpha))}
function revealTitle(k,lines,p,accent=C.gold){const a=phase(p,.02,.22);x.save();x.globalAlpha=a;x.translate(lerp(-28,0,a),0);bigTitle(k,lines,accent,1);x.restore()}
function scene01(f,s,e){const p=lp(f,s,e);revealTitle('La decisión',['¿EMPRESA,','FONDO O ETF?'],p,C.gold);const sub=phase(p,.18,.36);txt('Tres caminos. Tres compras distintas.',72,540,27,C.muted,500,'Inter','left',sub);const centers=[[900,430],[1260,430],[1605,430]],data=[[imgs.company,'ACCIÓN','Una empresa',C.violet],[imgs.fund,'FONDO','Una cartera gestionada',C.teal],[imgs.etf,'ETF','Una cartera cotizada',C.gold2]];const origin=[1260,820];const node=phase(p,.12,.28);circle(origin[0],origin[1],58,C.navy,null,0);txt('TÚ',origin[0],origin[1]+10,24,C.paper,760,'Inter','center',node);data.forEach((d,i)=>{const a=phase(p,.25+i*.1,.48+i*.1);const cx=centers[i][0],cy=centers[i][1];x.save();x.globalAlpha=a;const yy=lerp(cy+90,cy,out(a));arrow(origin[0],origin[1]-60,cx,cy+225,d[3],4,phase(p,.18+i*.08,.44+i*.08));shadowEllipse(cx,cy+210,115,18,.18*a);circle(cx,cy+205,122,'rgba(255,252,245,.7)',d[3],3);image(d[0],cx-175,yy-155,350,300,a,.78+.22*a);pill(d[1],cx-100,665,200,d[3],C.paper,a);txt(d[2],cx,750,21,C.ink,560,'Inter','center',a);x.restore()});const q=phase(p,.76,.95);pill('PRIMERO: ¿QUÉ ESTÁS COMPRANDO?',825,900,870,C.navy,C.paper,q)}
function scene02(f,s,e){const p=lp(f,s,e);revealTitle('Horizonte',['LARGO PLAZO','≠ LÍNEA RECTA'],p,C.teal);const left=650,top=260,w=1120,h=570,axes=phase(p,.08,.24);x.save();x.globalAlpha=axes;line(left,top+h,left+w,top+h,C.ink,3);line(left,top,left,top+h,C.ink,3);for(let i=0;i<=10;i++){const xx=left+i*w/10;line(xx,top+h-8,xx,top+h+8,C.ink,2);txt(String(i),xx,top+h+40,18,C.muted,550,'Inter','center')}txt('AÑOS',left+w,top+h+76,17,C.muted,700,'Inter','right');x.restore();const pts=[];for(let i=0;i<=160;i++){const t=i/160;const y=.7-.42*t+.105*Math.sin(t*25)+.045*Math.sin(t*61);pts.push([left+w*t,top+h*y])}const grow=phase(p,.18,.72),n=Math.max(2,Math.floor(pts.length*grow));x.save();x.beginPath();pts.slice(0,n).forEach((q,i)=>i?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));x.strokeStyle=C.teal;x.lineWidth=8;x.lineJoin='round';x.stroke();const last=pts[n-1];circle(last[0],last[1],12,C.paper,C.teal,5);x.restore();const fall=phase(p,.48,.65);x.save();x.globalAlpha=fall;const q=pts[103];circle(q[0],q[1],48,'rgba(200,94,77,.11)',C.coral,3);pill('CAÍDA INTERMEDIA',q[0]-135,q[1]+70,270,C.coral);x.restore();const end=phase(p,.7,.92);pill('CRECIMIENTO POTENCIAL',1390,225,360,C.teal,C.paper,end);txt('El recorrido importa tanto como el destino.',72,620,27,C.muted,500,'Inter','left',end)}
function scene03(f,s,e){const p=lp(f,s,e);revealTitle('Distinción esencial',['ACTIVO','≠ VEHÍCULO'],p,C.violet);const a1=phase(p,.13,.38),flow=phase(p,.35,.62),a2=phase(p,.52,.78);x.save();x.globalAlpha=a1;shadowEllipse(790,690,140,22,.2*a1);image(imgs.company,610,305,360,350,a1,.75+.25*a1);pill('ACCIÓN',680,690,220,C.violet);txt('PARTE DE UNA EMPRESA',790,785,20,C.ink,650,'Inter','center');x.restore();arrow(965,520,1180,520,C.gold,8,flow);txt('SE AGRUPA DENTRO DE',1070,480,16,C.gold,760,'Inter','center',flow);const vehicles=[[imgs.fund,1330,'FONDO',C.teal],[imgs.etf,1640,'ETF',C.gold2]];vehicles.forEach((d,i)=>{const a=phase(p,.5+i*.1,.76+i*.1);x.save();x.globalAlpha=a;shadowEllipse(d[1],690,125,20,.18*a);image(d[0],d[1]-170,315,340,320,a,.78+.22*a);pill(d[2],d[1]-95,690,190,d[3]);txt('VEHÍCULO',d[1],785,20,C.ink,650,'Inter','center');x.restore()});const q=phase(p,.78,.96);pill('EL ACTIVO PRODUCE · EL VEHÍCULO ORGANIZA',770,890,900,C.navy,C.paper,q)}
function token(t,cx,cy,col,a){x.save();x.globalAlpha=a;circle(cx,cy,48,C.white,col,3);fit(t,cx,cy+7,82,17,col,750,'Inter','center');x.restore()}
function scene04(f,s,e){const p=lp(f,s,e);revealTitle('Dos decisiones',['PRIMERO QUÉ.','DESPUÉS CÓMO.'],p,C.gold);const a1=phase(p,.12,.38);x.save();x.globalAlpha=a1;card(670,225,1080,260,'rgba(255,252,245,.92)',C.violet,a1);circle(735,290,31,C.violet);txt('01',735,300,20,C.paper,800,'Inter','center');txt('ELIGE LA EXPOSICIÓN',800,302,31,C.navy,720);[['EMPRESAS',960],['PAÍSES',1190],['SECTORES',1420],['MERCADOS',1650]].forEach((d,i)=>token(d[0],d[1],395,C.violet,phase(p,.22+i*.05,.42+i*.05)));x.restore();const flow=phase(p,.38,.58);arrow(1210,495,1210,620,C.gold,8,flow);const a2=phase(p,.5,.75);x.save();x.globalAlpha=a2;card(670,635,1080,260,'rgba(255,252,245,.92)',C.teal,a2);circle(735,700,31,C.teal);txt('02',735,710,20,C.paper,800,'Inter','center');txt('ELIGE EL VEHÍCULO',800,712,31,C.navy,720);[['DIRECTO',1010,C.violet],['FONDO',1270,C.teal],['ETF',1530,C.gold2]].forEach((d,i)=>{const q=phase(p,.6+i*.06,.82+i*.06);pill(d[0],d[1]-105,780,210,d[2],C.paper,q)});x.restore();const q=phase(p,.82,.97);pill('ACTIVO  →  VEHÍCULO  →  DECISIÓN',845,930,750,C.navy,C.paper,q)}
const scenes=[scene01,scene02,scene03,scene04];
function draw(frame){const f=Math.max(0,Math.min(LAST,Math.round(frame)));let i=PLANS.findIndex(v=>f>=v[1]&&f<v[2]);if(i<0)i=3;bg(f,PLANS[i][0]);scenes[i](f,PLANS[i][1],PLANS[i][2])}
Promise.all([document.fonts.ready,...Object.values(imgs).map(im=>new Promise(r=>{if(im.complete)r();else{im.onload=r;im.onerror=r}}))]).then(()=>{draw(0);window.__nuvia={last:LAST,plans:PLANS,still:f=>draw(f),setFrame:f=>draw(f),exportStill:f=>draw(f)}})
</script></body></html>
