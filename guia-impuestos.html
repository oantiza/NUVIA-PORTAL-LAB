<!-- ══ REENVÍO ═══════════════════════════════════════════════════════════════
     Esta página fue durante un tiempo la cáscara de un iframe que servía las
     tres guías fiscales del núcleo. Cada guía tiene ya una página propia, con
     su título escrito en el HTML publicado. Se conserva el fichero porque los
     enlaces con ?guia= llegaron a publicarse: reenvía al destino correcto y,
     sin JavaScript, muestra las tres puertas.
     ═══════════════════════════════════════════════════════════════════════ -->
<script>
(function () {
  var DESTINOS = {
    calendar: 'guia-calendario.html',
    savings: 'guia-ahorro.html',
    inheritance: 'guia-sucesiones.html'
  };
  var destino = DESTINOS[new URLSearchParams(window.location.search).get('guia')] || 'fiscalidad.html#guias';
  window.location.replace(destino);
})();
</script>

<div class="nuvia-page">
  <main id="contenido" class="nv-container gu-section">
    <h1 class="gu-title">Las guías de Mis impuestos han cambiado de dirección</h1>
    <p class="gu-lead">Cada guía tiene ahora su propia página. Si no se te redirige automáticamente, elige la que buscabas.</p>

      <a href="guia-ahorro.html">Fiscalidad del ahorro</a>
      <a href="guia-sucesiones.html">Sucesiones y donaciones</a>
    </nav>

    <p class="gu-rule-top"><a href="fiscalidad.html#guias">Volver a Mis impuestos</a></p>
  </main>
</div>

</body>
